# Shared font for all lock-screen text.
$lock_font = JetBrainsMono Nerd Font

# BACKGROUND
background {
    monitor =
    path = ~/.config/hypr/assets/wallpaper.jpg
    blur_passes = 3
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    hide_cursor = false
    ignore_empty_input = true
    fail_timeout = 900
}

# Input feedback: briefly flash the border red, then return to neutral.
animations {
    enabled = true
    animation = inputFieldColors, 1, 2, linear
    animation = inputFieldDots, 1, 2, default
}

# Profile-Photo
image {
    monitor =
    path = ~/.config/hypr/assets/avatar.jpg
    border_size = 2
    border_color = rgba(255, 255, 255, 1.0)
    size = 130
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 0, 40
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = rgba(216, 222, 233, 0.70)
    font_size = 25
    font_family = $lock_font
    position = 0, 338
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color = rgba(216, 222, 233, 0.70)
    font_size = 120
    font_family = $lock_font
    position = 0, 238
    halign = center
    valign = center
}

# USER - plain label like the SDDM login area.
label {
    monitor =
    text = $USER
    color = rgb(D8DEE9)
    font_size = 18
    font_family = $lock_font
    position = 0, -67
    halign = center
    valign = center
}

# INPUT FIELD - SDDM's 300x50 translucent rounded field.
# Hyprlock 0.9.6 has no text caret or native click-to-submit action.
# Enter submits the password.
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    rounding = 8
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = false
    inner_color = rgba(255, 255, 255, 0.10)
    outer_color = rgba(216, 222, 233, 0.18)
    font_color = rgb(D8DEE9)
    font_family = $lock_font
    fade_on_empty = false
    placeholder_text = <span size="18432" foreground="##d8dee9">password</span>
    check_text = <span size="18432" foreground="##d8dee9">Checking…</span>
    check_color = rgba(216, 222, 233, 0.18)
    fail_text = <span size="18432" foreground="##d8dee9">password</span>
    fail_color = rgb(EB6674)
    capslock_color = rgba(160, 115, 40, 0.65)
    swap_font_color = false
    hide_input = false
    position = 0, -122
    halign = center
    valign = center
}

# CURRENT SONG
image {
    monitor =
    path = ~/.cache/hyprlock/album-art
    size = 200
    rounding = 12
    border_size = 2
    border_color = rgba(255, 255, 255, 1.0)
    reload_time = 5
    reload_cmd = ~/.config/hypr/Scripts/albumart.sh
    position = 0, 195
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/Scripts/songdetail.sh
    color = rgba(255, 255, 255, 0.6)
    font_size = 18
    font_family = $lock_font
    position = 0, 60
    halign = center
    valign = bottom
}

# AUDIO VISUALIZER - playback bars between the album cover and song title.
label {
    monitor =
    text = cmd[update:33] exec cat "$XDG_RUNTIME_DIR/hyprlock-cava/frame" 2>/dev/null
    color = rgba(216, 222, 233, 0.75)
    font_size = 26
    font_family = $lock_font
    position = 0, 110
    halign = center
    valign = bottom
}

# MEDIA CONTROLS
label {
    monitor =
    text = ⏮
    color = rgba(255, 255, 255, 0.85)
    font_size = 25
    font_family = $lock_font
    position = -55, 15
    halign = center
    valign = bottom
    onclick = ~/.config/hypr/Scripts/mediactl.sh previous
}

label {
    monitor =
    text = cmd[update:500] ~/.config/hypr/Scripts/mediactl.sh status-icon
    color = rgba(255, 255, 255, 0.85)
    font_size = 25
    font_family = $lock_font
    position = 0, 15
    halign = center
    valign = bottom
    onclick = ~/.config/hypr/Scripts/mediactl.sh play-pause
}

label {
    monitor =
    text = ⏭
    color = rgba(255, 255, 255, 0.85)
    font_size = 25
    font_family = $lock_font
    position = 55, 15
    halign = center
    valign = bottom
    onclick = ~/.config/hypr/Scripts/mediactl.sh next
}
