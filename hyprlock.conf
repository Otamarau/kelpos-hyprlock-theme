# BACKGROUND
background {
    monitor =
    path = ~/.config/hypr/assets/laptop-wallpaper.jpg
    blur_passes = 3
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    ignore_empty_input = true
    fail_timeout = 900
}

# Kelpos authentication feedback: briefly flash red, then return to neutral.
animations {
    enabled = true
    animation = inputFieldColors, 1, 2, linear
    animation = inputFieldDots, 1, 2, default
}

# Profie-Photo
image {
    monitor =
    path = ~/.config/hypr/assets/laptop-avatar.jpg
    border_size = 2
    border_color = rgba(255, 255, 255, 1.0)
    size = 156
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 0, 48
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = rgba(216, 222, 233, 0.70)
    font_size = 30
    font_family = JetBrainsMono Nerd Font
    position = 0, 410
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color = rgba(216, 222, 233, 0.70)
    font_size = 144
    font_family = JetBrainsMono Nerd Font
    position = 0, 300
    halign = center
    valign = center
}

# USER-BOX
shape {
    monitor =
    size = 360, 72
    color = rgba(255, 255, 255, .1)
    rounding = 10
    border_size = 0
    border_color = rgba(2A2A2AFF)
    rotate = 0
    xray = false # if true, make a "hole" in the background (rectangle of specified size, no rotation)

    position = 0, -156
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text = $USER
    color = rgba(216, 222, 233, 0.80)
    font_size = 22
    font_family = JetBrainsMono Nerd Font 
    position = 0, -156
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 360, 72
    outline_thickness = 2
    rounding = 10
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(216, 222, 233, 0.18)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(D8DEE9)
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <span size="18432" foreground="##d8dee9">password</span>
    check_text = <span size="18432" foreground="##d8dee9">Checking…</span>
    check_color = rgba(216, 222, 233, 0.18)
    fail_text = <span size="18432" foreground="##d8dee9">password</span>
    fail_color = rgb(EB6674)
    capslock_color = rgba(160, 115, 40, 0.65)
    swap_font_color = false
    hide_input = false
    position = 0, -252
    halign = center
    valign = center
}

# CURRENT SONG
image {
    monitor =
    path = ~/.cache/hyprlock/album-art
    size = 204
    rounding = 14
    border_size = 2
    border_color = rgba(255, 255, 255, 1.0)
    reload_time = 5
    reload_cmd = ~/.config/hypr/albumart.sh
    position = 0, 198
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/songdetail.sh
    color = rgba(255, 255, 255, 0.6)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 72
    halign = center
    valign = bottom
}

# AUDIO VISUALIZER - frames published by lock-with-cava.py.
label {
    monitor =
    text = cmd[update:33] exec cat "$XDG_RUNTIME_DIR/hyprlock-cava/frame" 2>/dev/null
    color = rgba(216, 222, 233, 0.75)
    font_size = 26
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = bottom
}

# MEDIA CONTROLS
label {
    monitor =
    text = ⏮
    color = rgba(255, 255, 255, 0.85)
    font_size = 30
    font_family = JetBrainsMono Nerd Font
    position = -66, 18
    halign = center
    valign = bottom
    onclick = ~/.config/hypr/mediactl.sh previous
}

label {
    monitor =
    text = cmd[update:500] ~/.config/hypr/mediactl.sh status-icon
    color = rgba(255, 255, 255, 0.85)
    font_size = 30
    font_family = JetBrainsMono Nerd Font
    position = 0, 18
    halign = center
    valign = bottom
    onclick = ~/.config/hypr/mediactl.sh play-pause
}

label {
    monitor =
    text = ⏭
    color = rgba(255, 255, 255, 0.85)
    font_size = 30
    font_family = JetBrainsMono Nerd Font
    position = 66, 18
    halign = center
    valign = bottom
    onclick = ~/.config/hypr/mediactl.sh next
}
