[general]
framerate = 30
bars = 20
autosens = 1
sleep_timer = 2

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 8
bar_delimiter = 59
frame_delimiter = 10
channels = stereo

[smoothing]
# Slightly gentler falloff while retaining responsive movement at 30 fps.
noise_reduction = 0.45
